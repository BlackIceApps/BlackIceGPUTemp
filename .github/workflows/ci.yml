name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Display .NET and MSBuild info
      run: |
        dotnet --info
        dotnet --version
        dotnet msbuild -version

    - name: Restore dependencies (locked mode)
      run: dotnet restore TinyTemp.sln --locked-mode

    - name: Build Solution (Release)
      run: dotnet build TinyTemp.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test TinyTemp.sln --configuration Release --no-build --verbosity normal

    - name: Verify Single EXE Staging
      shell: pwsh
      run: |
        $stagingDir = "$env:GITHUB_WORKSPACE\staging"
        New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

        $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\src\TinyTemp\bin" -Filter "TinyTemp.exe" -Recurse -File | Select-Object -First 1

        if (-not $exe) {
          Write-Error "TinyTemp.exe was not found anywhere under src/TinyTemp/bin."
          Get-ChildItem "$env:GITHUB_WORKSPACE\src\TinyTemp\bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }

        Write-Host "Found EXE: $($exe.FullName)"
        Copy-Item $exe.FullName $stagingDir

        $files = Get-ChildItem -Path $stagingDir -Recurse -File
        Write-Host "Files in staging directory:"
        $files | ForEach-Object { Write-Host $_.FullName }

        if ($files.Count -ne 1) {
          Write-Error "Staging validation failed: expected exactly 1 file, found $($files.Count)."
          exit 1
        }

        Write-Host "Staging validation passed: exactly 1 file (TinyTemp.exe)."

    - name: Upload Diagnostics and Staging Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TinyTemp-Artifacts-win-x64
        path: |
          staging/TinyTemp.exe
          diagnostics/TinyTemp.Diagnostics/bin/**/TinyTemp.Diagnostics.exe
        if-no-files-found: error

