name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - '**/*.md'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - '**/*.md'

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Display .NET and MSBuild info
      run: |
        dotnet --info
        dotnet --version
        dotnet msbuild -version

    - name: Restore dependencies (locked mode)
      run: dotnet restore BlackIceGPUTemp.sln --locked-mode

    - name: Build Solution (Release)
      run: dotnet build BlackIceGPUTemp.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test BlackIceGPUTemp.sln --configuration Release --no-build --verbosity normal

    - name: Verify Single EXE Staging
      shell: pwsh
      run: |
        $stagingDir = "$env:GITHUB_WORKSPACE\staging"
        New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

        $expectedPath = "$env:GITHUB_WORKSPACE\src\BlackIceGPUTemp\bin\Release\net48\win-x64\BlackIceGPUTemp.exe"

        if (-not (Test-Path -Path $expectedPath -PathType Leaf)) {
          Write-Error "Expected release artifact not found: $expectedPath"
          if (Test-Path "$env:GITHUB_WORKSPACE\src\BlackIceGPUTemp\bin") {
            Write-Host "Contents of bin directory:"
            Get-ChildItem "$env:GITHUB_WORKSPACE\src\BlackIceGPUTemp\bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
          }
          exit 1
        }

        $allExes = Get-ChildItem "$env:GITHUB_WORKSPACE\src\BlackIceGPUTemp\bin\Release\net48\win-x64" -Filter "BlackIceGPUTemp.exe" -File
        if ($allExes.Count -ne 1) {
          Write-Error "Expected exactly one BlackIceGPUTemp.exe in Release/net48/win-x64, found $($allExes.Count)."
          $allExes | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }

        Write-Host "Found EXE: $expectedPath"
        Copy-Item $expectedPath $stagingDir

        $files = Get-ChildItem -Path $stagingDir -Recurse -File
        Write-Host "Files in staging directory:"
        $files | ForEach-Object { Write-Host $_.FullName }

        if ($files.Count -ne 1) {
          Write-Error "Staging validation failed: expected exactly 1 file, found $($files.Count)."
          exit 1
        }

        Write-Host "Staging validation passed: exactly 1 file (BlackIceGPUTemp.exe)."


    - name: Upload BlackIceGPUTemp Application
      uses: actions/upload-artifact@v7
      with:
        name: BlackIceGPUTemp-win-x64
        path: staging/BlackIceGPUTemp.exe
        if-no-files-found: error


