name: Bootstrap Lockfiles

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore and generate lockfiles
      run: |
        dotnet restore BlackIceGPUTemp.sln --force-evaluate

    - name: Commit lockfiles
      shell: pwsh
      run: |
        $lockfiles = Get-ChildItem -Path . -Filter packages.lock.json -Recurse

        if ($lockfiles.Count -eq 0) {
          throw "No packages.lock.json files were generated."
        }

        $lockfiles | ForEach-Object { Write-Host $_.FullName }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A -- ":(glob)**/packages.lock.json"

        git diff --cached --quiet
        if ($LASTEXITCODE -eq 0) {
          Write-Host "No lockfile changes to commit."
        } else {
          git commit -m "chore: add NuGet lockfiles"
          git push
        }